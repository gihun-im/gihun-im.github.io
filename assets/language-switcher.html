<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", () => {
    const isKorean = document.documentElement.lang.toLowerCase().startsWith("ko");
    const translatedPages = new Set(["index.html", "projects.html", "pubs.html"]);
    const offset = document.querySelector('meta[name="quarto:offset"]')?.content || "./";
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const currentFile = pathParts.at(-1)?.endsWith(".html") ? pathParts.at(-1) : "index.html";
    const isTopLevelEnglishPage = !isKorean && offset === "./" && translatedPages.has(currentFile);
    const englishTarget = isKorean ? `${offset}${currentFile}` : currentFile;
    const koreanTarget = isKorean
      ? currentFile
      : (isTopLevelEnglishPage ? `ko/${currentFile}` : `${offset}ko/index.html`);

    document.querySelectorAll(".navbar-nav .nav-link").forEach((link) => {
      const label = link.textContent.trim();
      if (!isKorean) return;
      const koreanNavigation = {
        "About": { text: "소개", href: "index.html" },
        "Projects": { text: "연구 프로젝트", href: "projects.html" },
        "Publications": { text: "연구 실적", href: "pubs.html" },
        "CV": { text: "이력서" }
      };
      const navigationItem = koreanNavigation[label];

      if (navigationItem) {
        link.textContent = navigationItem.text;
        if (navigationItem.href) link.href = navigationItem.href;

        if (navigationItem.href === currentFile) {
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
        }
      }
    });

    document.querySelectorAll(".dropdown-item").forEach((link) => {
      const label = link.textContent.trim();
      if (label === "English") link.href = isKorean ? englishTarget : currentFile;
      if (label === "한국어") link.href = isKorean ? currentFile : koreanTarget;
    });
  });
</script>
