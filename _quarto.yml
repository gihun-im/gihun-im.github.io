project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "projects/**/*.qmd"
    - "ko/*.qmd"
    - "!archive/**"

website:
  title: "Gihun Im"
  site-url: https://gihun-im.github.io
  description: "A personal academic website by Gihun Im"
  page-footer: "&copy; []{#current-year} Gihun Im. Powered by [Quarto](https://quarto.org)."
  google-analytics: 
    tracking-id: "G-Z60BZ0KHGW"
  navbar:
    background: dark
    search: false
    right:
      - text: About
        href: index.qmd
      - text: Projects
        href: projects.qmd
      - text: Publications
        href: pubs.qmd
      - text: CV
        href: cv.qmd
      - text: "EN / KO"
        menu:
          - text: English
            href: index.qmd
          - text: 한국어
            href: ko/index.qmd
      - text: "{{< iconify fa6-solid:envelope >}}"
        aria-label: Email
        href: "mailto:gihun.im@icloud.com"
      - text: "{{< iconify fa6-brands:linkedin >}}"
        aria-label: LinkedIn
        href: "https://www.linkedin.com/in/gihun-im-7a2367210/"
      - text: "{{< iconify fa6-brands:github-alt>}}"
        aria-label: GitHub
        href: "https://github.com/gihun-im"

format:
  html:
    theme: 
      - darkly
      - custom.scss
    fontcolor: "#ebebeb"
    linkcolor: "#70CCAE"
    toc: false
    include-after-body:
      - text: |
          <script type="text/javascript">
            document.getElementById('current-year').textContent = new Date().getFullYear();
          </script>
      - file: assets/language-switcher.html

editor: visual

lang: en
